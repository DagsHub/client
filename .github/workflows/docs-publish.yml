name: Docs

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish to production (leave empty to deploy the selected ref to test)"
        required: false
        type: string
  push:
    branches:
      - main
  workflow_run:
    workflows: [Upload Python Package]
    types: [completed]
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DOCS_REF: ${{ inputs.release_tag || github.event.workflow_run.head_sha || github.ref }}

jobs:
  build:
    name: Build documentation
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "./docs"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DOCS_REF }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install client and dependencies
        working-directory: "./"
        run: |
          python -m pip install --upgrade pip setuptools
          pip install .

      - name: Install docs dependencies
        run: |
          pip install -r requirements-docs.txt

      - name: Build documentation
        run: SPHINXOPTS="-W" make html

      - name: Upload build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/build/html

  deploy-test:
    name: Deploy to test.dagshub.com
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag == '')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DOCS_REF }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-html
          path: build/html

      - name: Assemble deploy package
        run: |
          mkdir -p dist/docs/client
          cp -r build/html/. dist/docs/client/
          cp docs/deploy/root-index.html dist/index.html
          cp docs/deploy/staticwebapp.config.json dist/staticwebapp.config.json
          cp docs/deploy/404.html dist/404.html

      - name: Deploy to test SWA
        env:
          SWA_DEPLOY_TOKEN: ${{ secrets.SWA_DEPLOY_TOKEN_TEST }}
        run: npx --yes @azure/static-web-apps-cli deploy ./dist --deployment-token "$SWA_DEPLOY_TOKEN" --env production

  deploy-prod:
    name: Deploy to dagshub.com
    needs: build
    if: github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    concurrency:
      group: client-docs-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DOCS_REF }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-html
          path: build/html

      - name: Assemble deploy package
        run: |
          mkdir -p dist/docs/client
          cp -r build/html/. dist/docs/client/
          cp docs/deploy/root-index.html dist/index.html
          cp docs/deploy/staticwebapp.config.json dist/staticwebapp.config.json
          cp docs/deploy/404.html dist/404.html

      - name: Deploy to prod SWA
        env:
          SWA_DEPLOY_TOKEN: ${{ secrets.SWA_DEPLOY_TOKEN_PROD }}
        run: npx --yes @azure/static-web-apps-cli deploy ./dist --deployment-token "$SWA_DEPLOY_TOKEN" --env production
